services:
  - type: web
    name: titan-camera-server
    runtime: docker
    rootDir: TitanCameraServer
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: CORS_ORIGINS
        value: https://titan-web-cam.vercel.app,http://localhost:5173,http://localhost:3000
      # WebRTC TURN (set in Render Dashboard → Environment):
      # TURN_URLS=turn:your-domain:3478,turns:your-domain:5349
      # TURN_USERNAME=your-user
      # TURN_CREDENTIAL=your-secret
      # Optional: STUN_URL=stun:stun.l.google.com:19302
