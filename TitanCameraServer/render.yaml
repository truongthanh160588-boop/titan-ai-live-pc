services:
  - type: web
    name: titan-camera-server
    runtime: docker
    rootDir: TitanCameraServer
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: CORS_ORIGINS
        value: https://titan-web-cam.vercel.app,http://localhost:5173,http://localhost:3000
      # WebRTC Metered.ca via env (comma-separated TURN_URLS — must include turn:/turns: URIs):
      # TURN_URLS=stun:stun.relay.metered.ca:80,turn:global.relay.metered.ca:80,turn:global.relay.metered.ca:80?transport=tcp,turn:global.relay.metered.ca:443,turns:global.relay.metered.ca:443?transport=tcp
      # TURN_USERNAME=<Metered dashboard>
      # TURN_CREDENTIAL=<Metered dashboard>
